<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Английский паровозик: Present Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

        }
        .wagon::before {

</head>
<body>

<div class="game-container">
    <!-- Счетчик уровней -->
    <div id="level-counter"></div>

    <h1 class="text-4xl md:text-5xl font-bold text-slate-800 mb-2 mt-8" style="font-family: 'Fredoka One', cursive;">Английский паровозик</h1>
    <p class="text-slate-600 mb-6 text-lg">Перетащи вагоны-слова, чтобы составить правильный вопрос.</p>

    <!-- Drop Zone: Куда перетаскивать вагоны -->
    <div id="drop-zone" class="p-4 rounded-xl mb-6 flex items-end justify-start gap-2">
        <!-- Обновленный локомотив -->
        <span class="locomotive" aria-hidden="true"><span class="smokestack"></span><span class="cab-window"></span></span>
        <!-- Вагоны и Замыкающий вагон будут здесь -->
    </div>

    <!-- Source Zone: Откуда брать вагоны -->
    <div id="source-zone" class="p-4 bg-slate-200/50 rounded-xl flex flex-wrap justify-center items-center min-h-[120px]">
        <!-- Вагоны будут добавлены сюда с помощью JavaScript -->
    </div>

    <!-- Feedback and Controls -->
    <div class="mt-6 h-16 flex items-center justify-center">
        <div id="feedback" class="text-3xl font-bold" style="font-family: 'Fredoka One', cursive;"></div>
        <button id="next-btn" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-full text-xl transition-transform duration-200 hover:scale-105">Следующий вопрос →</button>
    </div>
    
        <div id="end-game-modal" class="hidden" role="dialog" aria-modal="true">
        <div>
            <h2>Поздравляю!</h2>
            <p>Ты собрал все 7 вопросов!</p>
            <p id="final-score"></p>
            <div class="result-actions">
                <label for="player-name">Имя игрока</label>
                <input id="player-name" type="text" maxlength="20" placeholder="Введите имя">
                <button id="save-result-btn" type="button">Сохранить результат</button>
                <p id="save-status" aria-live="polite"></p>
                <button id="restart-btn" type="button">Играть снова</button>
            </div>
        </div>
    </div>
    <section class="leaderboard" aria-labelledby="leaderboard-title">
        <div class="leaderboard-heading"><h2 id="leaderboard-title">Таблица лидеров</h2><button id="clear-leaderboard-btn" class="secondary-button" type="button">Очистить</button></div>
        <p id="leaderboard-status" aria-live="polite">Лучшие результаты на этом устройстве</p>
        <ol id="leaderboard-list"></ol>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>

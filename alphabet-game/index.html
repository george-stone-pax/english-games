<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Alphabet Order Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Главный контейнер игры -->
  <div class="game-container" id="gameContainer">
    
    <!-- Шапка и панель управления -->
    <header class="game-header">
      <h1>English Alphabet Order</h1>
      <p class="instruction">Расставь буквы английского алфавита в правильном порядке!</p>
      
      <!-- Верхняя панель: громкость и полный экран -->
      <div class="top-controls">
        <div class="volume-control">
          <button id="muteBtn" class="icon-btn" title="Включить/Выключить звук">🔊</button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.3" title="Громкость">
        </div>
        <button id="fullscreenBtn" class="icon-btn" title="Полноэкранный режим">⛶</button>
      </div>
    </header>

    <!-- Игровое поле: сетка для букв -->
    <main class="board-area">
      <div class="alphabet-grid" id="alphabetGrid">
        <!-- Буквы алфавита будут динамически генерироваться с помощью JavaScript -->
      </div>
    </main>

    <!-- Панель действий -->
    <footer class="game-footer">
      <button id="startBtn" class="btn primary-btn">Начать игру</button>
      <button id="checkBtn" class="btn success-btn" disabled>Проверить</button>
      <button id="resetBtn" class="btn secondary-btn">Сбросить</button>
    </footer>

    <!-- Окно сообщения об успехе / победе -->
    <div class="modal" id="winModal">
      <div class="modal-content">
        <h2>🎉 Отлично!</h2>
        <p>Ты правильно расставил все 26 букв алфавита!</p>
        <button id="restartBtn" class="btn primary-btn">Сыграть ещё раз</button>
      </div>
    </div>

  </div>

  <!-- ================================================================= -->
  <!-- АУДИОЗАПИСИ (Фоновая музыка и звуковые эффекты)                   -->
  <!-- При необходимости замените ссылки на свои из GitHub Pages:        -->
  <!-- ================================================================= -->
  
  <!-- Фоновая музыка -->
  <audio id="bgMusic" loop preload="auto">
    <!-- Ссылка на фоновую музыку (GitHub Pages) -->
    <source src="https://george-stone-pax.github.io/my-game-assets/Aylex%20-%20Back%20To%20Life%20(freetouse.com).mp3" type="audio/mpeg">
  </audio>

  <!-- Звук правильного ответа / победы -->
  <audio id="correctSound" preload="auto">
    <!-- Ссылка на звук правильного ответа (GitHub Pages) -->
    <source src="https://george-stone-pax.github.io/my-game-assets/rightanswer-95219.mp3" type="audio/mpeg">
  </audio>

  <!-- Звук неправильного ответа / ошибки -->
  <audio id="wrongSound" preload="auto">
    <!-- Ссылка на звук неправильного ответа (GitHub Pages) -->
    <source src="https://george-stone-pax.github.io/my-game-assets/dodgeball.mp3" type="audio/mpeg">
  </audio>

  <!-- Подключение скрипта логики -->
  <script src="script.js"></script>
</body>
</html>
